<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Heartphoria</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Hanya warna dasar agar tidak berkedip putih saat pindah halaman */
        :root { --bg: #FAFAF8; }
        html.dark { --bg: #1A1208; }
        body { background: var(--bg); height: 100dvh; margin: 0; overflow: hidden; }
    
    </style>
</head>
<body>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Samakan warna background dengan tema Telegram
        if (tg.colorScheme === 'dark') {
            document.documentElement.classList.add('dark');
            tg.setBackgroundColor('#1A1208'); 
            tg.setHeaderColor('#1A1208');
        } else {
            tg.setBackgroundColor('#FAFAF8'); 
            tg.setHeaderColor('#FAFAF8');
        }

        async function init() {
            const tgId = tg.initDataUnsafe?.user?.id;
            const cacheBuster = "?v=" + new Date().getTime();

            // Jika error, langsung lempar ke onboarding
            if (!tgId) {
                window.location.replace('onboarding.html' + cacheBuster);
                return;
            }

            try {
                // Proses cek user ke database secepat kilat
                const API_BASE = "https://bauhaus-match-bot.botgampang123.workers.dev"; 
                const res = await fetch(`${API_BASE}/api/user?tg_id=${tgId}`);
                const data = await res.json();

                // TANPA DELAY / TIMEOUT - Langsung Pindah!
                if (data.exists && (data.is_onboarding_complete == 1 || data.is_onboarding_complete === true)) {
                    window.location.replace('app.html' + cacheBuster);
                } else {
                    window.location.replace('onboarding.html' + cacheBuster);
                }
            } catch (e) {
                window.location.replace('onboarding.html' + cacheBuster);
            }
        }
        
        init();
    </script>
</body>
</html>
